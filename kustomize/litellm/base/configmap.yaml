apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
data:
  config.yaml: |
    model_list:

      # vllm: OpenAI-compatible endpoint on cyberdyne02 (one overlay active at a time)
      - model_name: qwen3.5-fast:35b
        litellm_params:
          model: openai/Qwen/Qwen3.5-35B-A3B
          api_base: http://cyberdyne02-qwen35-vllm:8000/v1
          api_key: "_none_"

      - model_name: qwen3.5-thinking:35b
        litellm_params:
          model: openai/Qwen/Qwen3.5-35B-A3B
          api_base: http://cyberdyne02-qwen35-vllm:8000/v1
          api_key: "_none_"
          extra_body:
            chat_template_kwargs:
              enable_thinking: true

      # cyberdyne01: external ollama host
      # UPDATE: replace model name with whatever is pulled on cyberdyne01
      - model_name: qwen3.6-fast:35b
        litellm_params:
          model: openai/Qwen/Qwen3.6-35B-A3B
          api_base:  http://cyberdyne01-qwen36-vllm:8000/v1
          api_key: "_none_"

      - model_name: qwen3.6-thinking:35b
        litellm_params:
          model: openai/Qwen/Qwen3.6-35B-A3B
          api_base:  http://cyberdyne01-qwen36-vllm:8000/v1
          api_key: "_none_"
          extra_body:
            chat_template_kwargs:
              enable_thinking: true

      # cyberdyne02: embedding model
      - model_name: qwen3-embed:8b
        litellm_params:
          model: openai/Qwen/Qwen3-Embedding-8B
          api_base: http://cyberdyne02-qwen-embed-vllm:8000/v1
          api_key: "_none_"
          mode: embedding

    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
      database_url: os.environ/DATABASE_URL
      store_model_in_db: true
      control_plane_url: https://samwise-api.library.ucdavis.edu
      user_header_mappings:
        - header_name: "X-OpenWebUI-User-Email"
          litellm_user_role: "customer"
