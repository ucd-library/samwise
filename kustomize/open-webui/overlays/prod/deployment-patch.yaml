apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
spec:
  replicas: 4
  template:
    spec:
      containers:
        - name: open-webui
          # Pin to a specific release tag — update per release
          image: ghcr.io/open-webui/open-webui:v0.9.6
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: open-webui-config
          env:
            - name: UVICORN_WORKERS
              value: "1"
            - name: WEBUI_WORKERS
              value: "1"
            - name: OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: oauth-client-secret
                  key: secret
            - name: WEBUI_URL
              value: https://samwise.library.ucdavis.edu
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-secret
                  key: master-key
      nodeSelector:
        intended-for: "samwise-frontend"