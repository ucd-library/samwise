apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
spec:
  template:
    spec:
      # stop k8s from injecting env vars that cause vllm to fail
      enableServiceLinks: false
      nodeSelector:
        kubernetes.io/hostname: cyberdyne02.library.ucdavis.edu
      tolerations:
        - key: dedicated
          operator: Equal
          value: gpu-inference
          effect: NoSchedule
      containers:
        - name: vllm
          args:
            - --model
            - Qwen/Qwen3.5-35B-A3B
            - --host
            - "0.0.0.0"
            - --port
            - "8000"
            - --gpu-memory-utilization
            - "0.80"
            - --max-model-len
            - "16384"
            - --tensor-parallel-size
            - "1"
            - --enable-chunked-prefill
            - --reasoning-parser
            - "qwen3"