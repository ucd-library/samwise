apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
spec:
  selector:
    matchLabels:
      app: cyberdyne01-qwen36-vllm
  template:
    metadata:
      labels:
        app: cyberdyne01-qwen36-vllm
    spec:
      # stop k8s from injecting env vars that cause vllm to fail
      enableServiceLinks: false
      nodeSelector:
        kubernetes.io/hostname: cyberdyne01.library.ucdavis.edu
      tolerations:
        - key: dedicated
          operator: Equal
          value: gpu-inference
          effect: NoSchedule
      containers:
        - name: vllm
          args:
            - --model
            - Qwen/Qwen3.6-35B-A3B
            - --host
            - "0.0.0.0"
            - --port
            - "8000"
            - --gpu-memory-utilization
            - "0.80"
            - --max-model-len
            - "131072"
            - --tensor-parallel-size
            - "1"
            - --enable-chunked-prefill
            - --reasoning-parser
            - "qwen3"
            - --enable-auto-tool-choice
            - --tool-call-parser
            - "qwen3_coder"
            - --default-chat-template-kwargs 
            - '{"enable_thinking": false}'