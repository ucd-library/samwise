apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
spec:
  selector:
    matchLabels:
      app: cyberdyne02-qwen38-vllm
  template:
    metadata:
      labels:
        app: cyberdyne02-qwen38-vllm
    spec:
      # stop k8s from injecting env vars that cause vllm to fail
      enableServiceLinks: false
      nodeSelector:
        kubernetes.io/hostname: cyberdyne02.library.ucdavis.edu
      tolerations:
        - key: dedicated
          operator: Equal
          value: gpu-inference
          effect: NoSchedule
      containers:
        - name: vllm
          args:
            - --model
            - Qwen/Qwen3.8-27B-FP8
            - --host
            - "0.0.0.0"
            - --port
            - "8000"
            - --gpu-memory-utilization
            - "0.85"
            - --max-model-len
            - "131072"
            - --kv-cache-dtype
            - "fp8"
            - --tensor-parallel-size
            - "1"
            - --enable-prefix-caching
            - --speculative-config
            - '{"method":"mtp","num_speculative_tokens":3}'
            - --reasoning-parser
            - "qwen3"
            - --enable-auto-tool-choice
            - --tool-call-parser
            - "qwen3_coder"
            - --default-chat-template-kwargs 
            - '{"enable_thinking": false}'