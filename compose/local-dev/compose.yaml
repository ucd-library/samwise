
services:

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    ports:
      - "8080:8080"
    environment:
      ENABLE_OLLAMA_API: "False"
      ENABLE_OPENAI_API: "True"
      ENABLE_OPENAI_API_PASSTHROUGH: "True"
      BYPASS_EMBEDDING_AND_RETRIEVAL: "True"
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/samwise
      ENABLE_OAUTH_SIGNUP: "true"
      ENABLE_OAUTH_PERSISTENT_CONFIG: "false"
      OAUTH_CLIENT_ID: "ollama"
      WEBUI_URL: "http://localhost:8080"
      OPENID_PROVIDER_URL: "https://auth.library.ucdavis.edu/realms/internal/.well-known/openid-configuration"
      OAUTH_PROVIDER_NAME: "UC Davis CAS"
      OAUTH_SCOPES: "openid profile email groups"
      ENABLE_PASSWORD_AUTH: "false"
      ENABLE_LOGIN_FORM: "false"
      WEBUI_NAME: "Samwise"
    env_file:
      - .env
    volumes:
      - open-webui:/app/backend/data
    depends_on:
      - ai-proxy

  ai-proxy:
    build: ../../../ai-proxy
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/aiproxy"
    volumes:
      - ./ai-proxy-config.yaml:/app/config.yaml:ro
      - ./models.yaml:/app/models.yaml:ro
      - ./ai-proxy-token-plugin.js:/plugins/token.js:ro
    depends_on:
      postgres:
        condition: service_healthy

  # litellm:
  #   image: ghcr.io/berriai/litellm:main-latest
  #   ports:
  #     - "4000:4000"
  #   environment:
  #     DATABASE_URL: postgresql://postgres:postgres@postgres:5432/litellm
  #     LITELLM_MASTER_KEY: "${LITELLM_MASTER_KEY:-sk-dev-local}"
  #   volumes:
  #     - ./litellm-config.yaml:/app/config.yaml:ro
  #   command: ["--config", "/app/config.yaml", "--port", "4000"]
  #   depends_on:
  #     postgres:
  #       condition: service_healthy

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: samwise
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d/
      - ../../../ai-proxy/sql/schema.sql:/sql/aiproxy-schema.sql:ro
      - ../../../ai-proxy/sql/seed.sql:/sql/aiproxy-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  open-webui:
  postgres-data:
