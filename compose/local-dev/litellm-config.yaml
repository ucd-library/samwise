# LiteLLM local-dev config. Used when the litellm service is uncommented in compose.yaml.
# To activate: uncomment litellm in compose.yaml, set OPENAI_API_BASE_URL=http://litellm:4000
# in .env, and uncomment the litellm DB line in postgres-init/00-aiproxy.sh.

model_list:

  - model_name: qwen3.5-fast:35b
    litellm_params:
      model: openai/Qwen/Qwen3.5-35B-A3B
      api_base: http://cyberdyne02.library.ucdavis.edu:8000/v1
      api_key: "_none_"

  - model_name: qwen3.5-thinking:35b
    litellm_params:
      model: openai/Qwen/Qwen3.5-35B-A3B
      api_base: http://cyberdyne02.library.ucdavis.edu:8000/v1
      api_key: "_none_"
      extra_body:
        chat_template_kwargs:
          enable_thinking: true

  - model_name: qwen3.6-fast:35b
    litellm_params:
      model: openai/Qwen/Qwen3.6-35B-A3B
      api_base: http://cyberdyne01.library.ucdavis.edu:8000/v1
      api_key: "_none_"

  - model_name: qwen3.6-thinking:35b
    litellm_params:
      model: openai/Qwen/Qwen3.6-35B-A3B
      api_base: http://cyberdyne01.library.ucdavis.edu:8000/v1
      api_key: "_none_"
      extra_body:
        chat_template_kwargs:
          enable_thinking: true

  - model_name: qwen3-embed:8b
    litellm_params:
      model: openai/Qwen/Qwen3-Embedding-8B
      api_base: http://cyberdyne02.library.ucdavis.edu:8001/v1
      api_key: "_none_"
      mode: embedding

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true
  user_header_mappings:
    - header_name: "X-OpenWebUI-User-Email"
      litellm_user_role: "customer"
