server:
  port: 3000
  bodyLimit: "10mb"

database:
  url: "${DATABASE_URL}"

# tokenPlugin and x-header names are set via env vars (AUTH_TOKEN_PLUGIN,
# AUTH_IDENTITY_HEADER, AUTH_EMAIL_HEADER) so they don't need to live here.
auth:
  xHeaders:
    enabled: true

debug: false

retention:
  usageLogs: 7
