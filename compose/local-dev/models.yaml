# Samwise local-dev model seed for ai-proxy.
# Loaded at startup — inserts only if model/backend does not already exist.
# config fields are deep-merged into every upstream request body.

- id: qwen3.5-fast:35b
  upstreamModel: Qwen/Qwen3.5-35B-A3B
  lbStrategy: least-connections
  backends:
    - host: cyberdyne02.library.ucdavis.edu
      port: 30800

- id: qwen3.5-thinking:35b
